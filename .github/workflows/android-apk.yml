name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      live_reload_url:
        description: "URL HTTPS pública da porta 5173 do Codespaces (opcional)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Configure optional Codespaces live reload
        env:
          LIVE_RELOAD_URL: ${{ github.event.inputs.live_reload_url }}
        run: |
          if [ -n "$LIVE_RELOAD_URL" ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const path = "capacitor.config.json";
              const config = JSON.parse(fs.readFileSync(path, "utf8"));
              config.server = { url: process.env.LIVE_RELOAD_URL, cleartext: false };
              fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\\n");
            '
            echo "APK configurado para carregar: $LIVE_RELOAD_URL"
          else
            echo "APK usará os arquivos locais incluídos no pacote."
          fi

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arvores-de-nazareno-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
